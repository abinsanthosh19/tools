<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Markdown Export</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; line-height: 1.7; color: #0f172a; }
    pre { background: #0d1117; color: #e6edf3; padding: 1em; border-radius: 8px; overflow-x: auto; }
    code { font-family: ui-monospace, monospace; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #cbd5e1; padding: 0.5em 0.75em; }
    blockquote { border-left: 3px solid #6366f1; margin: 0; padding-left: 1em; color: #475569; }
  </style>
</head>
<body>
  {{CONTENT}}
</body>
</html>
