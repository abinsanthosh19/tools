    <style>
      /* ==========================================================================
         DESIGN TOKENS
         ========================================================================== */

      :root {
        --bg-main: #090d16;
        --bg-card: rgba(19, 27, 46, 0.6);
        --bg-card-hover: rgba(25, 36, 61, 0.8);
        --border-color: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(99, 102, 241, 0.5);

        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;

        --accent-primary: #6366f1;
        --accent-glow: rgba(99, 102, 241, 0.25);

        --search-bg: rgba(15, 23, 42, 0.8);
        --icon-bg: rgba(255, 255, 255, 0.03);
        --tag-bg: rgba(255, 255, 255, 0.05);
        --error: #f43f5e;
        --error-bg: rgba(244, 63, 94, 0.05);
        --error-border: rgba(244, 63, 94, 0.35);

        --bg-gradient:
          radial-gradient(
            circle at 50% 0%,
            rgba(99, 102, 241, 0.15) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(14, 165, 233, 0.05) 0%,
            transparent 40%
          );

        --heading-gradient: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
        --card-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);

        --radius-lg: 16px;
        --radius-md: 10px;
        --radius-sm: 6px;

        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        --font-mono:
          "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
      }

      [data-theme="light"] {
        --bg-main: #f8fafc;
        --bg-card: rgba(255, 255, 255, 0.75);
        --bg-card-hover: rgba(255, 255, 255, 0.95);
        --border-color: rgba(0, 0, 0, 0.08);
        --border-hover: rgba(79, 70, 229, 0.4);

        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;

        --accent-primary: #4f46e5;
        --accent-glow: rgba(79, 70, 229, 0.15);

        --search-bg: rgba(255, 255, 255, 0.85);
        --icon-bg: rgba(0, 0, 0, 0.04);
        --tag-bg: rgba(0, 0, 0, 0.05);

        --bg-gradient:
          radial-gradient(
            circle at 50% 0%,
            rgba(79, 70, 229, 0.08) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(14, 165, 233, 0.05) 0%,
            transparent 40%
          );

        --heading-gradient: linear-gradient(135deg, #0f172a 0%, #334155 100%);
        --card-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.08);
      }

      /* ==========================================================================
         BASE
         ========================================================================== */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        color-scheme: dark;
        scroll-behavior: smooth;
      }

      html[data-theme="light"] {
        color-scheme: light;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 2rem 1.5rem 4rem;
        background-color: var(--bg-main);
        background-image: var(--bg-gradient);
        background-attachment: fixed;
        color: var(--text-primary);
        font-family: var(--font-sans);
        line-height: 1.5;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      code {
        font-family: var(--font-mono);
      }

      .container {
        width: min(100%, 1100px);
        margin-inline: auto;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* ==========================================================================
         TOP BAR / THEME
         ========================================================================== */

      .top-bar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 1rem;
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border: 1px solid var(--border-color);
        border-radius: 999px;
        background: var(--bg-card);
        color: var(--text-primary);
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 500;
        backdrop-filter: blur(8px);
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.2s ease;
      }

      .theme-toggle:hover {
        border-color: var(--accent-primary);
        box-shadow: 0 0 12px var(--accent-glow);
      }

      .theme-toggle:active {
        transform: scale(0.98);
      }

      .theme-toggle svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }

      [data-theme="dark"] .moon-icon,
      [data-theme="light"] .sun-icon {
        display: none;
      }

      /* ==========================================================================
         HEADER
         ========================================================================== */

      header {
        margin-bottom: 3rem;
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 1rem;
        padding: 4px 12px;
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 20px;
        background: rgba(99, 102, 241, 0.1);
        color: var(--accent-primary);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-primary);
        box-shadow: 0 0 8px var(--accent-primary);
      }

      .badge a {
        color: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      .badge a:hover {
        text-decoration: underline;
      }

      h1 {
        margin: 0 0 0.75rem;
        background: var(--heading-gradient);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: clamp(2rem, 5vw, 2.75rem);
        font-weight: 800;
        letter-spacing: -0.025em;
      }

      .subtitle {
        max-width: 550px;
        margin: 0 auto 2rem;
        color: var(--text-secondary);
        font-size: 1.1rem;
      }

      /* ==========================================================================
         SEARCH
         ========================================================================== */

      .search-wrapper {
        position: relative;
        width: min(100%, 480px);
        margin-inline: auto;
      }

      .search-input {
        width: 100%;
        padding: 12px 16px 12px 44px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        outline: none;
        background: var(--search-bg);
        color: var(--text-primary);
        font-size: 0.95rem;
        backdrop-filter: blur(8px);
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .search-input::placeholder {
        color: var(--text-muted);
      }

      .search-input:focus {
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }

      .search-icon {
        position: absolute;
        top: 50%;
        left: 14px;
        width: 18px;
        height: 18px;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      /* ==========================================================================
         TOOLS GRID / CARDS
         ========================================================================== */

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 240px;
        padding: 1.5rem;
        overflow: hidden;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        background: var(--bg-card);
        color: inherit;
        text-decoration: none;
        backdrop-filter: blur(12px);
        transition:
          background 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease,
          transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .card::before {
        position: absolute;
        inset: 0 0 auto;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent-primary),
          transparent
        );
        content: "";
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .card:hover,
      .card:focus-visible {
        background: var(--bg-card-hover);
        border-color: var(--border-hover);
        box-shadow:
          var(--card-shadow),
          0 0 20px var(--accent-glow);
        transform: translateY(-4px);
      }

      .card:hover::before,
      .card:focus-visible::before {
        opacity: 1;
      }

      .card:focus-visible,
      .theme-toggle:focus-visible {
        outline: 2px solid var(--accent-primary);
        outline-offset: 3px;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .icon-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        background: var(--icon-bg);
        color: var(--accent-primary);
        transition:
          transform 0.2s ease,
          background-color 0.2s ease;
      }

      .icon-box svg {
        display: block;
        max-width: 28px;
        max-height: 28px;
      }

      .card:hover .icon-box,
      .card:focus-visible .icon-box {
        background: rgba(99, 102, 241, 0.15);
        transform: scale(1.05);
      }

      .tag {
        padding: 2px 8px;
        border-radius: var(--radius-sm);
        background: var(--tag-bg);
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        white-space: nowrap;
      }

      .card-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 0.5rem;
        font-size: 1.2rem;
        font-weight: 700;
      }

      .card-title svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        color: var(--accent-primary);
        opacity: 0;
        transform: translateX(-4px);
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      .card:hover .card-title svg,
      .card:focus-visible .card-title svg {
        opacity: 1;
        transform: translateX(0);
      }

      .card-description {
        margin: 0;
        color: var(--text-secondary);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-color);
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 0.8rem;
      }

      /* ==========================================================================
         EMPTY / ERROR STATES
         ========================================================================== */

      .status-card {
        grid-column: 1 / -1;
        min-height: auto;
        cursor: default;
      }

      .status-card:hover {
        transform: none;
      }

      .status-card.error {
        border-color: var(--error-border);
        background: var(--error-bg);
      }

      .status-card.error .icon-box,
      .status-card.error .tag,
      .status-card.error .card-title {
        color: var(--error);
      }

      .status-card.error .icon-box {
        border-color: rgba(244, 63, 94, 0.25);
        background: rgba(244, 63, 94, 0.12);
      }

      .status-card.error .tag {
        background: rgba(244, 63, 94, 0.15);
      }

      .status-card.error .card-footer {
        border-top-color: rgba(244, 63, 94, 0.2);
        color: var(--error);
      }

      .status-card-title {
        margin: 0 0 0.5rem;
        font-size: 1.1rem;
      }

      .status-card-description {
        margin: 0;
        color: var(--text-secondary);
      }

      .status-card-description code {
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        background: var(--tag-bg);
      }

      /* ==========================================================================
         FOOTER
         ========================================================================== */

      footer {
        margin-top: 4rem;
        padding-top: 2rem;
        border-top: 1px solid var(--border-color);
        color: var(--text-muted);
        font-size: 0.85rem;
        text-align: center;
      }

      footer code {
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        background: var(--tag-bg);
        font-family: var(--font-mono);
      }

      /* ==========================================================================
         RESPONSIVE / MOTION
         ========================================================================== */

      @media (max-width: 640px) {
        body {
          padding-inline: 1rem;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .card {
          min-height: 220px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="top-bar">
        <button
          class="theme-toggle"
          id="themeToggle"
          type="button"
          aria-label="Switch to light mode"
          aria-pressed="false"
        >
          <svg
            class="sun-icon"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
          <svg
            class="moon-icon"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
          <span id="themeToggleText">Light Mode</span>
        </button>
      </div>

      <header>
        <div class="badge">
          <span class="badge-dot" aria-hidden="true"></span>
          <a href="https://github.com/MJTech46">Made by MJTech46</a>
        </div>

        <h1>Developer Utilities</h1>

        <p class="subtitle">
          A fast, online-first collection of daily developer tools for free.
        </p>

        <div class="search-wrapper">
          <svg
            class="search-icon"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>

          <label class="visually-hidden" for="searchInput">Search tools</label>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="Search tool or keyword (e.g. uuid, hash, json)..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </header>

      <main>
        <section
          class="grid"
          id="toolsGrid"
          aria-label="Developer tools"
          aria-live="polite"
        ></section>
      </main>

      <footer>
        <p>
          Organized under <code>tools-config.json</code> • Built for fast online
          productivity
        </p>
      </footer>
    </div>

    <script>
      "use strict";

      // ==========================================================================
      // CONFIGURATION
      // ==========================================================================

      const CONFIG_URL = new URL("tools-config.json", document.baseURI);
      const THEME_STORAGE_KEY = "theme";

      // ==========================================================================
      // DOM REFERENCES
      // ==========================================================================

      const elements = {
        html: document.documentElement,
        themeToggle: document.getElementById("themeToggle"),
        themeToggleText: document.getElementById("themeToggleText"),
        searchInput: document.getElementById("searchInput"),
        toolsGrid: document.getElementById("toolsGrid"),
      };

      let tools = [];

      // ==========================================================================
      // THEME
      // ==========================================================================

      function getPreferredTheme() {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);

        if (savedTheme === "light" || savedTheme === "dark") {
          return savedTheme;
        }

        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      function applyTheme(theme, persist = true) {
        const normalizedTheme = theme === "light" ? "light" : "dark";

        elements.html.dataset.theme = normalizedTheme;

        if (persist) {
          localStorage.setItem(THEME_STORAGE_KEY, normalizedTheme);
        }

        const isDark = normalizedTheme === "dark";
        elements.themeToggleText.textContent = isDark
          ? "Light Mode"
          : "Dark Mode";
        elements.themeToggle.setAttribute(
          "aria-label",
          isDark ? "Switch to light mode" : "Switch to dark mode",
        );
        elements.themeToggle.setAttribute("aria-pressed", String(!isDark));
      }

      function toggleTheme() {
        const currentTheme = elements.html.dataset.theme;
        applyTheme(currentTheme === "dark" ? "light" : "dark");
      }

      // ==========================================================================
      // VALIDATION / NORMALIZATION
      // ==========================================================================

      function normalizeTool(tool) {
        if (!tool || typeof tool !== "object" || !tool.card) {
          return null;
        }

        const card = tool.card;
        const tags = Array.isArray(card.tags)
          ? card.tags.filter((tag) => typeof tag === "string")
          : [];

        return {
          id: tool.tool_id ?? card.id ?? "",
          name: String(tool.name ?? ""),
          title: String(card.title ?? tool.name ?? "Untitled Tool"),
          url: String(card.url ?? "#"),
          category: String(card.category ?? "TOOL"),
          description: String(card.description ?? ""),
          slug: String(card.footer?.slug ?? tool.name ?? ""),
          version: String(card.footer?.version ?? ""),
          icon: String(card.icon ?? ""),
          searchText: [
            tool.name,
            card.title,
            card.description,
            card.category,
            card.footer?.slug,
            ...tags,
          ]
            .filter(Boolean)
            .join(" ")
            .toLocaleLowerCase(),
        };
      }

      function normalizeConfig(data) {
        if (!data || !Array.isArray(data.tools)) {
          throw new Error('Invalid configuration: expected a "tools" array.');
        }

        return data.tools.map(normalizeTool).filter(Boolean);
      }

      // ==========================================================================
      // CARD CREATION
      // ==========================================================================

      function createArrowIcon() {
        const svg = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg",
        );

        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");

        const path = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path",
        );

        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        path.setAttribute("stroke-width", "2");
        path.setAttribute(
          "d",
          "M14 5l7 7m0 0l-7 7m7-7H3",
        );

        svg.appendChild(path);
        return svg;
      }

      function setIcon(iconBox, iconMarkup) {
        iconBox.textContent = "";

        if (!iconMarkup.trim()) {
          return;
        }

        const template = document.createElement("template");
        template.innerHTML = iconMarkup.trim();

        const svg = template.content.querySelector("svg");

        if (svg) {
          svg.setAttribute("aria-hidden", "true");
          iconBox.appendChild(svg);
        }
      }

      function createToolCard(tool) {
        const card = document.createElement("a");
        card.className = "card";
        card.href = tool.url;
        card.dataset.search = tool.searchText;
        card.dataset.toolId = String(tool.id);
        card.setAttribute(
          "aria-label",
          `Open ${tool.title}`,
        );

        const content = document.createElement("div");

        const header = document.createElement("div");
        header.className = "card-header";

        const iconBox = document.createElement("div");
        iconBox.className = "icon-box";
        setIcon(iconBox, tool.icon);

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = tool.category;

        header.append(iconBox, tag);

        const title = document.createElement("h2");
        title.className = "card-title";
        title.append(
          document.createTextNode(tool.title),
          createArrowIcon(),
        );

        const description = document.createElement("p");
        description.className = "card-description";
        description.textContent = tool.description;

        content.append(header, title, description);

        const footer = document.createElement("div");
        footer.className = "card-footer";

        const slug = document.createElement("span");
        slug.textContent = tool.id+": "+tool.slug;

        const version = document.createElement("span");
        version.textContent = tool.version;

        footer.append(slug, version);
        card.append(content, footer);

        return card;
      }

      function createStatusCard(title, message, isError = false) {
        const card = document.createElement("article");
        card.className = `card status-card${isError ? " error" : ""}`;

        const header = document.createElement("div");
        header.className = "card-header";

        const iconBox = document.createElement("div");
        iconBox.className = "icon-box";
        iconBox.textContent = isError ? "!" : "X";
        iconBox.setAttribute("aria-hidden", "true");

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = isError ? "ERROR" : "STATUS";

        header.append(iconBox, tag);

        const heading = document.createElement("h2");
        heading.className = "status-card-title";
        heading.textContent = title;

        const description = document.createElement("p");
        description.className = "status-card-description";
        description.textContent = message;

        card.append(header, heading, description);
        return card;
      }

      function renderTools(list) {
        const fragment = document.createDocumentFragment();

        list.forEach((tool) => {
          fragment.appendChild(createToolCard(tool));
        });

        elements.toolsGrid.replaceChildren(fragment);

        if (!list.length) {
          elements.toolsGrid.appendChild(
            createStatusCard(
              "No tools found",
              "Try a different search term or clear the search field.",
            ),
          );
        }
      }

      // ==========================================================================
      // SEARCH
      // ==========================================================================

      function filterTools(query) {
        const normalizedQuery = query.trim().toLocaleLowerCase();

        if (!normalizedQuery) {
          renderTools(tools);
          return;
        }

        const filteredTools = tools.filter((tool) =>
          tool.searchText.includes(normalizedQuery),
        );

        renderTools(filteredTools);
      }

      // ==========================================================================
      // LOAD CONFIG
      // ==========================================================================

      async function loadTools() {
        elements.toolsGrid.replaceChildren(
          createStatusCard("Loading tools...", "Reading tools-config.json."),
        );

        try {
          const response = await fetch(CONFIG_URL, {
            cache: "no-cache",
            headers: {
              Accept: "application/json",
            },
          });

          if (!response.ok) {
            throw new Error(
              `HTTP ${response.status}: ${response.statusText || "Request failed"}`,
            );
          }

          const data = await response.json();
          tools = normalizeConfig(data);

          if (!tools.length) {
            elements.toolsGrid.replaceChildren(
              createStatusCard(
                "No tools configured",
                "Add at least one tool to the tools array in tools-config.json.",
              ),
            );
            return;
          }

          filterTools(elements.searchInput.value);
        } catch (error) {
          console.error("Failed to load tools-config.json:", error);

          elements.toolsGrid.replaceChildren(
            createStatusCard(
              "Failed to load tools",
              `Unable to read tools-config.json. ${error.message}`,
              true,
            ),
          );
        }
      }

      // ==========================================================================
      // INITIALIZATION
      // ==========================================================================

      function init() {
        applyTheme(getPreferredTheme(), false);

        elements.themeToggle.addEventListener("click", toggleTheme);
        elements.searchInput.addEventListener("input", (event) => {
          filterTools(event.target.value);
        });

        loadTools();
      }

      init();
    </script>
    <script src="https://www.mj46.in/js/telemetry.js"></script>
  </body>
</html>
